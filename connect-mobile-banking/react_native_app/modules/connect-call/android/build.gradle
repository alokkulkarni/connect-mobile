// The banking app's call module: audio-only Amazon Connect web calling through the Amazon Chime SDK.
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.connectbanking.call"
    compileSdk safeExtGet("compileSdkVersion", 36)
    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "software.aws.chimesdk:amazon-chime-sdk:0.25.5"
    implementation "software.aws.chimesdk:amazon-chime-sdk-media:0.25.4"
}
